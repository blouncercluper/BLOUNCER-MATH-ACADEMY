gn:center;color:var(--muted)}.lessonhead{background:linear-gradient(120deg,#263d7b,#5067e7);color:white;padding:26px;border-radius:18px;margin-bottom:16px}.lessonhead h2{font-size:26px;margin:8px 0}.lessonhead p{color:#dce4ff;margin-bottom:0}.lessonblock{background:white;border:1px solid var(--line);border-radius:15px;padding:21px;margin:13px 0}.lessonblock h3{margin:0 0 12px}.lessonblock p{white-space:pre-wrap;line-height:1.7}.visualstory{background:#fff8e6;border:1px solid #ffedc2;border-radius:14px;padding:20px;text-align:center}.visualstory .big{font-size:50px;margin-bottom:10px}.options{display:grid;gap:9px;margin-top:14px}.options button{background:white;border:1px solid #e7eaf1;padding:11px;border-radius:10px;text-align:left}.options button:hover,.options button.chosen{border-color:#6179ee;background:#f0f3ff}.feedback{padding:12px;border-radius:10px;margin-top:10px}.good{background:#e8f9f1;color:#14845d}.bad{background:#fff1e5;color:#a95b16}.modalbg{position:fixed;inset:0;background:#101b35a8;display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}.modal{background:white;border-radius:17px;width:min(600px,100%);max-height:92vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0;font-size:20px}.modalhead button{background:#f0f2f7;border-radius:8px;padding:8px}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;font-size:13px;font-weight:700}.form input,.form textarea,.form select{border:1px solid #dfe4ef;border-radius:9px;padding:10px;background:white;width:100%}.form textarea{resize:vertical}.formactions{display:flex;justify-content:flex-end;gap:9px;margin-top:6px}.presentation{position:fixed;inset:0;background:#13244e;color:white;z-index:40;display:flex;flex-direction:column;padding:30px}.prescontent{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:1000px;margin:auto}.prescont {id:'foundation',name:'Math Foundation',tag:'LEVEL 01',emoji:'🌱',color:'green',desc:'Bangun fondasi berhitung dan pemahaman angka.',chapters:['Mengenal Angka','Nilai Tempat','Membandingkan Bilangan','Penjumlahan','Pengurangan','Perkalian Dasar','Pembagian Dasar','Pola Bilangan','Pecahan Dasar','Pengukuran','Uang dan Waktu','Bangun Datar']},

const authoredLessons={"Mengenal Angka":{"explanation":"Angka adalah tanda untuk menunjukkan banyak benda. Kita bisa menghitung dari 0, 1, 2, 3, dan seterusnya.","why":"Angka membantu kita tahu berapa mainan, teman, atau benda yang kita punya.","example":"Ada 5 ikan di akuarium. Yuk hitung: 🐟 🐟 🐟 🐟 🐟 = 5 ikan. Angka 5 menunjukkan jumlah ikan.","story":"Di kebun binatang mini ada 4 kelinci dan 3 kura-kura. Berapa jumlah hewan semuanya?","storyQuestion":"4 kelinci + 3 kura-kura = 7 hewan.","storyOptions":["6","7","8"],"storyAnswer":1,"storyFeedback":"Hitung semua hewan: empat ditambah tiga sama dengan tujuh.","exercises":[{"q":"Angka setelah 8 adalah…","options":["7","9","10"],"answer":1,"explanation":"Urutan angka setelah 8 adalah 9."},{"q":"Ada 6 pensil. Jumlah pensil ditunjukkan angka…","options":["5","6","7"],"answer":1,"explanation":"Enam pensil ditulis dengan angka 6."}]},"Nilai Tempat":{"explanation":"Setiap angka punya rumah: satuan, puluhan, ratusan, dan seterusnya. Letak angka membuat nilainya berbeda.","why":"Supaya kita tahu sebuah bilangan terdiri dari berapa satuan, puluhan, atau ratusan.","example":"Pada 42, angka 4 berada di rumah puluhan (nilainya 40), angka 2 di rumah satuan (nilainya 2). Jadi 42 = 40 + 2.","story":"Dina punya 3 kotak berisi sepuluh kancing dan 5 kancing lepas. Berapa kancing?","storyQuestion":"3 puluhan + 5 satuan = 35 kancing.","storyOptions":["305","35","53"],"storyAnswer":1,"storyFeedback":"Tiga puluhan berarti 30. Tambah 5 satuan menjadi 35.","exercises":[{"q":"Pada angka 67, angka 6 bernilai…","options":["6","60","600"],"answer":1,"explanation":"Angka 6 berada di tempat puluhan, nilainya 60."},{"q":"Bilangan 84 terdiri dari…","options":["8 + 4","80 + 4","8 + 40"],"answer":1,"explanation":"84 adalah 8 puluhan dan 4 satuan."}]},"Membandingkan Bilangan":{"explanation":"Kita dapat membandingkan bilangan untuk mengetahui mana yang lebih banyak, lebih sedikit, atau sama. Gunakan tanda >, <, dan =.","why":"Membandingkan membantu saat memilih, menghitung barang, atau melihat skor permainan.","example":"12 lebih besar dari 9, jadi 12 > 9. 5 lebih kecil dari 8, jadi 5 < 8. Jika 7 sama dengan 7, tulis 7 = 7.","story":"Tim Merah mendapat 18 poin. Tim Biru mendapat 15 poin. Tim mana yang lebih tinggi skornya?","storyQuestion":"18 lebih besar daripada 15. Tim Merah menang 3 poin.","storyOptions":["Tim Biru","Tim Merah","Skor sama"],"storyAnswer":1,"storyFeedback":"Bandingkan puluhannya dulu. 18 lebih besar dari 15.","exercises":[{"q":"Tanda yang tepat untuk 6 __ 10 adalah…","options":[">","<","="],"answer":1,"explanation":"Enam lebih kecil dari sepuluh, gunakan tanda <."},{"q":"Mana bilangan terbesar?","options":["29","92","39"],"answer":1,"explanation":"92 memiliki 9 puluhan, paling besar di pilihan."}]},"Penjumlahan":{"explanation":"Penjumlahan berarti menggabungkan atau menambah jumlah. Tanda penjumlahan adalah +.","why":"Kita memakai penjumlahan saat menghitung barang yang bertambah, uang, skor, atau teman yang bergabung.","example":"Ada 23 stiker dan mendapat 14 stiker lagi. 23 + 14 = 37. Satuan: 3 + 4 = 7. Puluhan: 2 + 1 = 3.","story":"Rafi punya 12 kelereng. Kakaknya memberi 9 kelereng. Berapa kelereng Rafi sekarang?","storyQuestion":"12 + 9 = 21 kelereng.","storyOptions":["19","20","21"],"storyAnswer":2,"storyFeedback":"Dua belas ditambah sembilan sama dengan dua puluh satu.","exercises":[{"q":"8 + 7 = …","options":["14","15","16"],"answer":1,"explanation":"8 + 7 = 15."},{"q":"25 + 10 = …","options":["30","35","45"],"answer":1,"explanation":"Menambah 10 membuat puluhan naik satu: 35."}]},"Pengurangan":{"explanation":"Pengurangan berarti mengambil sebagian atau mencari selisih. Tanda pengurangan adalah −.","why":"Kita menggunakan pengurangan saat barang berkurang atau ingin tahu selisih dua jumlah.","example":"15 − 6 = 9. Bayangkan 15 balon, 6 dilepas, tersisa 9 balon.","story":"Di rak ada 20 buku. Sebanyak 7 buku dipinjam. Berapa buku yang tersisa?","storyQuestion":"20 − 7 = 13 buku.","storyOptions":["12","13","14"],"storyAnswer":1,"storyFeedback":"Dua puluh dikurangi tujuh sama dengan tiga belas.","exercises":[{"q":"10 − 4 = …","options":["5","6","7"],"answer":1,"explanation":"10 dikurangi 4 adalah 6."},{"q":"18 − 9 = …","options":["8","9","10"],"answer":1,"explanation":"18 dikurangi 9 adalah 9."}]},"Perkalian Dasar":{"explanation":"Perkalian adalah cara cepat menjumlahkan kelompok yang sama berulang kali. 3 × 4 berarti 3 kelompok, masing-masing berisi 4.","why":"Perkalian membantu menghitung benda dalam kelompok, seperti telur di beberapa kotak atau roda pada sepeda.","example":"3 × 4 = 4 + 4 + 4 = 12. Ada 3 kantong, setiap kantong berisi 4 jeruk. Jumlahnya 12 jeruk.","story":"Ada 5 piring. Setiap piring berisi 2 kue. Berapa semua kue?","storyQuestion":"5 × 2 = 10 kue.","storyOptions":["7","10","12"],"storyAnswer":1,"storyFeedback":"Lima kelompok berisi dua kue berarti sepuluh kue.","exercises":[{"q":"4 × 3 = …","options":["7","12","16"],"answer":1,"explanation":"4 kelompok tiga: 3+3+3+3 = 12."},{"q":"2 × 6 = …","options":["8","10","12"],"answer":2,"explanation":"Dua kelompok enam berjumlah 12."}]},"Pembagian Dasar":{"explanation":"Pembagian berarti membagikan sama rata atau membentuk kelompok dengan ukuran sama.","why":"Pembagian membuat kita bisa berbagi adil dan mengetahui isi setiap kelompok.","example":"12 ÷ 3 = 4. Dua belas biskuit dibagi sama kepada 3 anak, masing-masing mendapat 4.","story":"24 pensil dibagikan sama rata kepada 6 anak. Berapa pensil tiap anak?","storyQuestion":"24 ÷ 6 = 4 pensil.","storyOptions":["3","4","6"],"storyAnswer":1,"storyFeedback":"Enam kelompok dari 24 berarti tiap kelompok berisi 4.","exercises":[{"q":"15 ÷ 3 = …","options":["4","5","6"],"answer":1,"explanation":"15 dibagi 3 sama dengan 5."},{"q":"20 ÷ 5 = …","options":["3","4","5"],"answer":1,"explanation":"20 dibagi 5 sama dengan 4."}]},"Pola Bilangan":{"explanation":"Pola bilangan adalah urutan angka yang mengikuti aturan tertentu. Angka bisa bertambah, berkurang, atau berganti aturan.","why":"Mengenali pola melatih otak melihat aturan dan memperkirakan angka berikutnya.","example":"2, 4, 6, 8, __. Aturannya tambah 2. Jadi angka berikutnya 10.","story":"Robot melangkah dengan pola 5, 10, 15, 20. Berapa langkah berikutnya?","storyQuestion":"Pola bertambah 5, jadi berikutnya 25.","storyOptions":["21","24","25"],"storyAnswer":2,"storyFeedback":"Setiap angka naik lima. 20 + 5 = 25.","exercises":[{"q":"3, 6, 9, __","options":["10","12","13"],"answer":1,"explanation":"Pola tambah 3, berikutnya 12."},{"q":"10, 8, 6, __","options":["5","4","2"],"answer":1,"explanation":"Pola berkurang 2, berikutnya 4."}]},"Pecahan Dasar":{"explanation":"Pecahan menunjukkan bagian dari satu benda utuh yang dibagi sama besar. Angka bawah menunjukkan jumlah bagian, angka atas menunjukkan bagian yang kita ambil.","why":"Pecahan dipakai saat membagi makanan, mengukur bahan, atau berbagi sesuatu secara adil.","example":"Satu pizza dibagi 4 bagian sama besar. Satu potong adalah 1/4. Jika dimakan 2 potong, berarti 2/4 pizza.","story":"Pizza dipotong menjadi 8 bagian sama besar. Nia makan 3 potong. Pecahan pizza yang dimakan?","storyQuestion":"Nia makan 3 dari 8 potong, yaitu 3/8.","storyOptions":["3/6","3/8","8/3"],"storyAnswer":1,"storyFeedback":"Angka atas menunjukkan potongan yang dimakan: 3. Angka bawah jumlah potongan: 8.","exercises":[{"q":"Setengah ditulis…","options":["1/2","2/1","1/3"],"answer":0,"explanation":"Setengah berarti satu dari dua bagian sama besar."},{"q":"Dari 5 bagian sama besar, 2 bagian diambil. Pecahannya…","options":["2/5","5/2","2/3"],"answer":0,"explanation":"Dua bagian dari lima ditulis 2/5."}]},"Pengukuran":{"explanation":"Satuan ukuran harus sesuai benda. Panjang memakai mm, cm, m, atau km; massa memakai g atau kg; waktu memakai detik, menit, dan jam.","why":"Kita dapat membandingkan dan merencanakan ukuran dengan tepat.","example":"2 m = 200 cm. 1 kg = 1.000 g. 1 jam = 60 menit.","story":"Meja panjangnya 120 cm. Apakah sama dengan 1 meter? Berapa selisihnya?","storyQuestion":"1 meter = 100 cm, jadi meja 20 cm lebih panjang.","storyOptions":["10 cm","20 cm","30 cm"],"storyAnswer":1,"storyFeedback":"120 cm dikurangi 100 cm = 20 cm.","exercises":[{"q":"3 km sama dengan…","options":["300 m","3.000 m","30.000 m"],"answer":1,"explanation":"1 km = 1.000 m, jadi 3 km = 3.000 m."},{"q":"2 kg sama dengan…","options":["200 g","2.000 g","20.000 g"],"answer":1,"explanation":"2 kilogram sama dengan 2.000 gram."}]},"Uang dan Waktu":{"explanation":"Uang digunakan untuk membeli barang. Waktu kita ukur menggunakan detik, menit, jam, hari, dan bulan.","why":"Kita belajar mengatur belanja dan datang tepat waktu.","example":"Rp5.000 + Rp2.000 = Rp7.000. Satu jam sama dengan 60 menit. Jika sekarang pukul 2 dan satu jam lagi, pukul 3.","story":"Doni membawa Rp10.000 dan membeli roti Rp4.000. Berapa uang kembaliannya?","storyQuestion":"Rp10.000 − Rp4.000 = Rp6.000.","storyOptions":["Rp4.000","Rp5.000","Rp6.000"],"storyAnswer":2,"storyFeedback":"Uang kembali adalah uang awal dikurangi harga roti.","exercises":[{"q":"30 menit adalah…","options":["setengah jam","2 jam","1 hari"],"answer":0,"explanation":"30 menit adalah setengah dari 60 menit."},{"q":"Rp3.000 + Rp4.000 = …","options":["Rp6.000","Rp7.000","Rp8.000"],"answer":1,"explanation":"Tiga ribu tambah empat ribu menjadi tujuh ribu."}]},"Bangun Datar":{"explanation":"Bangun datar adalah bentuk yang memiliki panjang dan lebar, tetapi tidak memiliki ketebalan seperti benda nyata. Contohnya segitiga, persegi, dan lingkaran.","why":"Bentuk membantu kita mengenali benda sekitar dan membuat gambar atau bangunan.","example":"Persegi memiliki 4 sisi sama panjang dan 4 sudut. Segitiga memiliki 3 sisi. Lingkaran tidak memiliki sisi lurus.","story":"Sebuah jendela berbentuk persegi memiliki empat sisi sama panjang. Bentuk apakah itu?","storyQuestion":"Jendela tersebut berbentuk persegi.","storyOptions":["Segitiga","Persegi","Lingkaran"],"storyAnswer":1,"storyFeedback":"Persegi memiliki empat sisi yang sama panjang.","exercises":[{"q":"Bangun dengan 3 sisi adalah…","options":["Segitiga","Persegi","Lingkaran"],"answer":0,"explanation":"Segitiga memiliki tiga sisi."},{"q":"Benda mirip lingkaran adalah…","options":["Pintu","Koin","Buku"],"answer":1,"explanation":"Koin umumnya berbentuk lingkaran."}]},"Bilangan Besar":{"explanation":"Bilangan besar memiliki banyak angka, seperti ribuan, puluhan ribu, dan ratusan ribu. Kita membaca nilainya dari kiri ke kanan.","why":"Kita perlu bilangan besar untuk menghitung jumlah penduduk, uang, atau barang dalam jumlah banyak.","example":"45.230 dibaca empat puluh lima ribu dua ratus tiga puluh. Nilainya: 40.000 + 5.000 + 200 + 30.","story":"Perpustakaan memiliki 12.450 buku. Sekolah lain punya 10.250 buku. Mana yang lebih banyak?","storyQuestion":"12.450 lebih besar daripada 10.250.","storyOptions":["10.250","12.450","Sama banyak"],"storyAnswer":1,"storyFeedback":"Bandingkan dari angka ribuan: 12 ribu lebih besar daripada 10 ribu.","exercises":[{"q":"Bilangan 3.000 + 400 + 20 + 6 adalah…","options":["3.426","3.246","3.624"],"answer":1,"explanation":"Nilai tempatnya menjadi 3.426."},{"q":"80.000 dibaca…","options":["Delapan ribu","Delapan puluh ribu","Delapan ratus"],"answer":1,"explanation":"80.000 adalah delapan puluh ribu."}]},"Operasi Hitung Bersusun":{"explanation":"Menghitung bersusun membantu kita menata angka agar satuan bertemu satuan, puluhan bertemu puluhan, dan seterusnya.","why":"Cara bersusun membuat hitungan besar lebih rapi dan mengurangi kesalahan.","example":"245 + 132: satuan 5+2=7, puluhan 4+3=7, ratusan 2+1=3. Hasilnya 377.","story":"Toko buku menjual 235 buku hari Senin dan 148 buku hari Selasa. Berapa total buku terjual?","storyQuestion":"235 + 148 = 383 buku.","storyOptions":["373","383","393"],"storyAnswer":1,"storyFeedback":"Satuan 5+8=13, tulis 3 simpan 1. Puluhan 3+4+1=8. Ratusan 2+1=3.","exercises":[{"q":"126 + 243 = …","options":["359","369","379"],"answer":1,"explanation":"126 + 243 = 369."},{"q":"500 − 275 = …","options":["225","235","275"],"answer":0,"explanation":"500 dikurangi 275 adalah 225."}]},"Operasi Hitung Campuran":{"explanation":"Operasi campuran berisi lebih dari satu jenis hitungan. Kerjakan perkalian dan pembagian terlebih dahulu, lalu penjumlahan dan pengurangan, kecuali ada tanda kurung yang harus dikerjakan lebih dulu.","why":"Aturan ini membuat semua orang mendapatkan jawaban yang sama dan tepat.","example":"2 + 3 × 4. Kerjakan 3 × 4 = 12 dahulu, lalu 2 + 12 = 14.","story":"Ada 3 kotak berisi 4 pensil, lalu ditambah 2 pensil lepas. Berapa semuanya?","storyQuestion":"3 × 4 + 2 = 12 + 2 = 14 pensil.","storyOptions":["12","14","20"],"storyAnswer":1,"storyFeedback":"Hitung pensil di kotak dulu, baru tambahkan 2 pensil.","exercises":[{"q":"5 + 2 × 3 = …","options":["11","21","15"],"answer":0,"explanation":"Perkalian dulu: 2×3=6, lalu 5+6=11."},{"q":"(10 − 4) ÷ 2 = …","options":["2","3","4"],"answer":1,"explanation":"Kurung dulu: 6 ÷ 2 = 3."}]},"Faktor dan Kelipatan":{"explanation":"Faktor adalah angka yang dapat membagi bilangan tanpa sisa. Kelipatan adalah hasil perkalian suatu angka dengan 1, 2, 3, dan seterusnya.","why":"Faktor dan kelipatan membantu menyusun kelompok, jadwal, dan menemukan pola.","example":"Faktor 12: 1, 2, 3, 4, 6, 12. Kelipatan 4: 4, 8, 12, 16, 20, dan seterusnya.","story":"Lampu merah menyala setiap 4 detik. Sebutkan tiga waktu menyala pertama setelah mulai.","storyQuestion":"Kelipatan 4: 4, 8, 12 detik.","storyOptions":["4, 8, 12","4, 6, 8","3, 6, 9"],"storyAnswer":0,"storyFeedback":"Lampu mengikuti kelipatan empat.","exercises":[{"q":"Yang merupakan faktor 15 adalah…","options":["4","5","6"],"answer":1,"explanation":"15 dapat dibagi 5 tanpa sisa."},{"q":"Kelipatan 6 adalah…","options":["12","14","16"],"answer":0,"explanation":"12 adalah 6×2."}]},"FPB":{"explanation":"FPB adalah Faktor Persekutuan Terbesar, yaitu faktor paling besar yang bisa membagi dua bilangan atau lebih tanpa sisa.","why":"FPB membantu membagi benda menjadi kelompok sama banyak dengan ukuran kelompok terbesar.","example":"FPB dari 12 dan 18: faktor 12 = 1,2,3,4,6,12; faktor 18 = 1,2,3,6,9,18. Faktor bersama terbesar adalah 6.","story":"Ada 12 jeruk dan 18 apel. Buah akan dimasukkan ke kantong-kantong dengan komposisi sama tanpa sisa. Berapa kantong paling banyak?","storyQuestion":"FPB(12,18)=6. Bisa dibuat 6 kantong, masing-masing 2 jeruk dan 3 apel.","storyOptions":["3 kantong","6 kantong","9 kantong"],"storyAnswer":1,"storyFeedback":"Cari faktor terbesar yang membagi 12 dan 18, yaitu 6.","exercises":[{"q":"FPB 8 dan 12 adalah…","options":["2","4","6"],"answer":1,"explanation":"Faktor bersama terbesar adalah 4."},{"q":"FPB 9 dan 15 adalah…","options":["3","5","9"],"answer":0,"explanation":"3 membagi 9 dan 15, dan itulah faktor bersama terbesar."}]},"KPK":{"explanation":"KPK adalah Kelipatan Persekutuan Terkecil, yaitu kelipatan sama yang paling kecil dari dua bilangan atau lebih.","why":"KPK membantu mengetahui kapan jadwal berulang bertemu lagi.","example":"Kelipatan 3: 3,6,9,12. Kelipatan 4: 4,8,12. KPK 3 dan 4 adalah 12.","story":"Bus A datang setiap 3 menit dan Bus B setiap 4 menit. Jika berangkat bersamaan, berapa menit lagi mereka bersama di halte?","storyQuestion":"KPK 3 dan 4 = 12 menit.","storyOptions":["7 menit","9 menit","12 menit"],"storyAnswer":2,"storyFeedback":"Kelipatan pertama yang sama adalah 12.","exercises":[{"q":"KPK 2 dan 5 adalah…","options":["7","10","15"],"answer":1,"explanation":"Kelipatan pertama yang sama adalah 10."},{"q":"KPK 4 dan 6 adalah…","options":["8","12","24"],"answer":1,"explanation":"12 adalah kelipatan 4 dan 6 terkecil yang sama."}]},"Pecahan":{"explanation":"Pecahan menyatakan bagian dari satu keseluruhan. Pecahan senilai terlihat berbeda, tetapi nilainya sama.","why":"Pecahan membantu berbagi makanan, mengukur bahan, dan memahami bagian dari jumlah.","example":"1/2 sama dengan 2/4. Jika satu pizza dibagi 2 dan kamu mengambil 1, sama banyak dengan mengambil 2 dari pizza yang dibagi 4.","story":"Kue dibagi menjadi 6 bagian. Siti makan 2 bagian. Pecahan yang dimakan dan bentuk sederhananya?","storyQuestion":"2/6 disederhanakan menjadi 1/3.","storyOptions":["1/2","1/3","2/3"],"storyAnswer":1,"storyFeedback":"2/6 dibagi pembilang dan penyebutnya dengan 2 menjadi 1/3.","exercises":[{"q":"Pecahan senilai 1/2 adalah…","options":["2/3","2/4","3/4"],"answer":1,"explanation":"2/4 sama dengan 1/2."},{"q":"3/5 + 1/5 = …","options":["4/5","4/10","3/10"],"answer":0,"explanation":"Penyebut sama, jumlahkan pembilang: 4/5."}]},"Desimal":{"explanation":"Desimal adalah cara menulis pecahan yang menggunakan koma. Angka di belakang koma menunjukkan bagian dari satu.","why":"Desimal digunakan untuk harga, panjang, berat, dan pengukuran yang tidak bulat.","example":"0,5 sama dengan setengah. 1,25 berarti satu utuh dan dua puluh lima perseratus.","story":"Panjang pita 1,5 meter. Pita lain 0,5 meter. Berapa panjang total?","storyQuestion":"1,5 + 0,5 = 2 meter.","storyOptions":["1 meter","2 meter","2,5 meter"],"storyAnswer":1,"storyFeedback":"Satu setengah ditambah setengah menjadi dua.","exercises":[{"q":"0,25 sama dengan…","options":["25 satuan","25 perseratus","2,5"],"answer":1,"explanation":"0,25 adalah 25 perseratus."},{"q":"2,4 + 1,3 = …","options":["3,5","3,7","4,7"],"answer":1,"explanation":"Tambah bagian satuan dan desimal: 3,7."}]},"Persen Dasar":{"explanation":"Persen berarti “per seratus”. 25% artinya 25 dari 100 bagian.","why":"Persen sering dipakai saat melihat diskon, hasil ujian, atau bagian suatu kelompok.","example":"50% sama dengan setengah. 10% dari 100 adalah 10. 25% dari 40 adalah seperempat dari 40, yaitu 10.","story":"Ada 20 murid. 50% ikut lomba menggambar. Berapa murid yang ikut?","storyQuestion":"50% dari 20 = 10 murid.","storyOptions":["5","10","15"],"storyAnswer":1,"storyFeedback":"50 persen berarti setengah. Setengah dari 20 adalah 10.","exercises":[{"q":"10% dari 100 adalah…","options":["1","10","20"],"answer":1,"explanation":"10% dari 100 adalah 10."},{"q":"25% dari 80 adalah…","options":["10","20","40"],"answer":1,"explanation":"25% adalah seperempat, 80÷4=20."}]},"Perbandingan":{"explanation":"Perbandingan menunjukkan hubungan jumlah dua hal. Contoh 2 banding 3 berarti setiap 2 benda pertama berpasangan dengan 3 benda kedua.","why":"Perbandingan membantu membuat resep, membagi tim, dan menyesuaikan ukuran.","example":"Perbandingan 2:3. Jika bagian pertama 2 gelas dan kedua 3 gelas, jumlahnya 5 gelas.","story":"Untuk membuat minuman, digunakan 2 sendok sirup dan 5 sendok air. Jika sirup 4 sendok, air berapa agar perbandingan sama?","storyQuestion":"Perbandingan sirup:air 2:5. Sirup menjadi dua kali, air juga dua kali: 10 sendok.","storyOptions":["7 sendok","8 sendok","10 sendok"],"storyAnswer":2,"storyFeedback":"Agar tetap 2:5, kalikan kedua bagian dengan 2.","exercises":[{"q":"Perbandingan 3:6 dapat disederhanakan menjadi…","options":["1:2","2:3","3:2"],"answer":0,"explanation":"Kedua angka dibagi 3 menjadi 1:2."},{"q":"Jika 1:4 menjadi 2:4, apakah tetap sama?","options":["Ya","Tidak","Tidak bisa tahu"],"answer":1,"explanation":"Hanya angka pertama yang berubah, jadi perbandingannya tidak sama."}]},"Keliling dan Luas":{"explanation":"Keliling adalah panjang garis yang mengelilingi bangun. Luas adalah ukuran seberapa banyak permukaan yang tertutup.","why":"Keliling berguna untuk memasang pagar. Luas berguna untuk menghitung karpet atau ubin.","example":"Persegi sisi 4 cm: keliling 4+4+4+4=16 cm. Luas 4×4=16 cm².","story":"Taman berbentuk persegi panjang panjang 6 m dan lebar 3 m. Berapa luasnya?","storyQuestion":"Luas = 6 × 3 = 18 m².","storyOptions":["9 m²","18 m²","24 m²"],"storyAnswer":1,"storyFeedback":"Luas persegi panjang adalah panjang dikali lebar.","exercises":[{"q":"Persegi sisi 5 cm, kelilingnya…","options":["10 cm","20 cm","25 cm"],"answer":1,"explanation":"4×5 = 20 cm."},{"q":"Persegi panjang 4×2 cm, luasnya…","options":["6 cm²","8 cm²","12 cm²"],"answer":1,"explanation":"4×2 = 8 cm²."}]},"Sudut":{"explanation":"Sudut terbentuk ketika dua garis atau sisi bertemu di satu titik. Sudut diukur dalam derajat.","why":"Sudut membantu kita memahami arah, bentuk, dan posisi benda.","example":"Sudut siku-siku besarnya 90°. Sudut kurang dari 90° disebut lancip. Sudut lebih dari 90° tetapi kurang dari 180° disebut tumpul.","story":"Sudut pojok buku biasanya berbentuk siku-siku. Berapa besar sudut siku-siku?","storyQuestion":"90 derajat.","storyOptions":["45°","90°","180°"],"storyAnswer":1,"storyFeedback":"Sudut siku-siku tepat 90 derajat.","exercises":[{"q":"Sudut 40° termasuk…","options":["Lancip","Siku-siku","Tumpul"],"answer":0,"explanation":"40° kurang dari 90°, jadi lancip."},{"q":"Sudut 120° termasuk…","options":["Lancip","Siku-siku","Tumpul"],"answer":2,"explanation":"120° lebih dari 90° dan kurang dari 180°."}]},"Data dan Diagram":{"explanation":"Data adalah kumpulan informasi. Data dapat disusun dalam tabel atau diagram agar lebih mudah dibaca dan dibandingkan.","why":"Data membantu kita melihat pilihan yang paling banyak, paling sedikit, dan pola sederhana.","example":"Pilihan buah: apel 4 anak, pisang 6 anak, jeruk 2 anak. Pisang paling banyak dipilih.","story":"Di kelas, 5 anak suka sepak bola, 3 suka bulu tangkis, dan 7 suka bersepeda. Olahraga apa paling disukai?","storyQuestion":"Bersepeda paling disukai karena dipilih 7 anak.","storyOptions":["Sepak bola","Bulu tangkis","Bersepeda"],"storyAnswer":2,"storyFeedback":"Bandingkan jumlah: 7 adalah yang terbesar.","exercises":[{"q":"Data 2, 4, 6: angka paling besar adalah…","options":["2","4","6"],"answer":2,"explanation":"6 paling besar."},{"q":"Jika 8 anak memilih merah dan 5 memilih biru, selisihnya…","options":["2","3","4"],"answer":1,"explanation":"8−5=3 anak."}]},"Bilangan Bulat":{"explanation":"Bilangan bulat mencakup bilangan positif, nol, dan bilangan negatif. Bilangan negatif berada di bawah nol, seperti suhu dingin atau lantai basement.","why":"Bilangan bulat membantu membaca suhu, posisi di bawah/atas permukaan, dan perubahan nilai.","example":"Pada garis bilangan, −3 lebih kecil dari −1. Jika suhu −2°C naik 5°C, suhu menjadi 3°C.","story":"Lift berada di lantai −2 (basement). Naik 5 lantai. Sekarang di lantai berapa?","storyQuestion":"−2 + 5 = 3, jadi lantai 3.","storyOptions":["−7","2","3"],"storyAnswer":2,"storyFeedback":"Mulai dari −2, naik lima langkah: −1, 0, 1, 2, 3.","exercises":[{"q":"−4 + 6 = …","options":["−2","2","10"],"answer":1,"explanation":"−4 ditambah 6 = 2."},{"q":"3 − 7 = …","options":["4","−4","−10"],"answer":1,"explanation":"Kurangi 7 dari 3, hasilnya −4."}]},"Operasi Hitung Kompleks":{"explanation":"Soal kompleks biasanya menggabungkan beberapa operasi dan membutuhkan urutan yang tepat. Gunakan aturan: kurung, kali/bagi, tambah/kurang.","why":"Strategi yang rapi membantu menyelesaikan soal panjang tanpa kehilangan langkah.","example":"(8 + 4) ÷ 3 + 2. Kurung: 12. Bagi: 4. Tambah 2: 6.","story":"Ada 4 kantong masing-masing 6 kelereng. Kelereng dibagikan ke 3 anak, lalu tiap anak mendapat tambahan 2. Berapa per anak?","storyQuestion":"(4 × 6) ÷ 3 + 2 = 24 ÷ 3 + 2 = 8 + 2 = 10.","storyOptions":["8","10","12"],"storyAnswer":1,"storyFeedback":"Ikuti urutan operasi dengan hati-hati.","exercises":[{"q":"18 ÷ 3 + 4 = …","options":["6","10","14"],"answer":1,"explanation":"Bagi dulu: 6+4=10."},{"q":"2 × (5 + 3) = …","options":["13","16","18"],"answer":1,"explanation":"Kurung 8, lalu 2×8=16."}]},"Pecahan Lanjutan":{"explanation":"Pecahan dapat ditambah, dikurangi, dikali, dan dibagi. Untuk tambah atau kurang, samakan penyebut terlebih dahulu.","why":"Pecahan membantu membagi ukuran dan menghitung bagian yang lebih rumit.","example":"1/2 + 1/4. Ubah 1/2 menjadi 2/4. Jadi 2/4 + 1/4 = 3/4.","story":"Resep membutuhkan 1/2 cangkir susu dan tambahan 1/4 cangkir. Berapa susu seluruhnya?","storyQuestion":"3/4 cangkir.","storyOptions":["1/2","2/3","3/4"],"storyAnswer":2,"storyFeedback":"Samakan penyebut menjadi empat: 2/4 + 1/4 = 3/4.","exercises":[{"q":"2/3 + 1/3 = …","options":["1","2/3","3/3"],"answer":0,"explanation":"2/3+1/3=3/3=1."},{"q":"3/4 − 1/4 = …","options":["1/4","1/2","3/8"],"answer":1,"explanation":"3/4−1/4=2/4=1/2."}]},"Desimal dan Persen":{"explanation":"Desimal dan persen dapat menyatakan bagian dari keseluruhan. Persen berarti per seratus, dan dapat diubah menjadi desimal.","why":"Kita dapat memahami harga diskon, nilai ujian, dan ukuran dengan lebih mudah.","example":"25% = 0,25 = 1/4. 50% = 0,5 = 1/2. 75% = 0,75 = 3/4.","story":"Harga tas Rp100.000 mendapat diskon 20%. Berapa besar potongan harganya?","storyQuestion":"20% dari Rp100.000 = Rp20.000.","storyOptions":["Rp10.000","Rp20.000","Rp80.000"],"storyAnswer":1,"storyFeedback":"20% berarti 20 dari setiap 100. Potongan harga adalah Rp20.000.","exercises":[{"q":"0,5 sama dengan…","options":["5%","50%","500%"],"answer":1,"explanation":"0,5 adalah 50 persen."},{"q":"10% dari 200 adalah…","options":["10","20","40"],"answer":1,"explanation":"200×10/100 = 20."}]},"Skala":{"explanation":"Skala menunjukkan perbandingan ukuran gambar dengan ukuran sebenarnya. Peta dan denah sering menggunakan skala.","why":"Skala membantu menggambar tempat yang besar di kertas kecil, tetapi tetap sesuai perbandingan.","example":"Skala 1:100 artinya 1 cm pada gambar mewakili 100 cm sebenarnya. Jika gambar 5 cm, ukuran sebenarnya 500 cm atau 5 m.","story":"Pada denah skala 1:200, panjang ruang digambar 4 cm. Berapa panjang sebenarnya?","storyQuestion":"4 × 200 = 800 cm = 8 meter.","storyOptions":["4 meter","6 meter","8 meter"],"storyAnswer":2,"storyFeedback":"Kalikan panjang gambar dengan 200, lalu ubah cm ke meter.","exercises":[{"q":"Skala 1:50, gambar 2 cm mewakili…","options":["50 cm","100 cm","150 cm"],"answer":1,"explanation":"2×50=100 cm."},{"q":"Ukuran sebenarnya 10 m pada skala 1:100 digambar…","options":["1 cm","10 cm","100 cm"],"answer":1,"explanation":"10 m = 1.000 cm. Dibagi 100 menjadi 10 cm."}]},"Kecepatan, Jarak, dan Waktu":{"explanation":"Kecepatan menunjukkan seberapa jauh benda bergerak dalam waktu tertentu. Jarak = kecepatan × waktu. Waktu = jarak ÷ kecepatan.","why":"Kita bisa memperkirakan waktu perjalanan dan memahami gerak kendaraan.","example":"Mobil bergerak 60 km per jam selama 2 jam. Jarak = 60 × 2 = 120 km.","story":"Sepeda melaju 10 km/jam selama 3 jam. Berapa jarak yang ditempuh?","storyQuestion":"10 × 3 = 30 km.","storyOptions":["13 km","20 km","30 km"],"storyAnswer":2,"storyFeedback":"Jarak diperoleh dari kecepatan dikali waktu.","exercises":[{"q":"Jarak 100 km ditempuh dengan 50 km/jam, waktunya…","options":["1 jam","2 jam","3 jam"],"answer":1,"explanation":"100÷50=2 jam."},{"q":"Kecepatan 40 km/jam selama 3 jam, jarak…","options":["80 km","120 km","160 km"],"answer":1,"explanation":"40×3=120 km."}]},"Debit":{"explanation":"Debit adalah banyaknya air yang mengalir dalam waktu tertentu. Contohnya liter per menit.","why":"Debit membantu menghitung berapa lama mengisi bak atau berapa banyak air yang mengalir.","example":"Jika 12 liter air mengalir selama 3 menit, debit = 12 ÷ 3 = 4 liter/menit.","story":"Keran mengalirkan 5 liter air setiap menit. Dalam 4 menit, berapa liter air terkumpul?","storyQuestion":"5 × 4 = 20 liter.","storyOptions":["9 liter","20 liter","25 liter"],"storyAnswer":1,"storyFeedback":"Debit dikali waktu: 5 liter/menit × 4 menit.","exercises":[{"q":"18 liter dalam 3 menit, debitnya…","options":["3 L/menit","6 L/menit","9 L/menit"],"answer":1,"explanation":"18÷3=6 L/menit."},{"q":"Debit 2 L/menit selama 5 menit menghasilkan…","options":["7 liter","10 liter","12 liter"],"answer":1,"explanation":"2×5=10 liter."}]},"FPB dan KPK Lanjutan":{"explanation":"FPB mencari pembagi bersama terbesar. KPK mencari kelipatan bersama terkecil. Ingat: FPB untuk membagi kelompok, KPK untuk waktu/pola yang bertemu.","why":"Keduanya membantu menyelesaikan masalah pembagian adil dan jadwal berulang.","example":"FPB 24 dan 36 = 12. KPK 6 dan 8 = 24. Gunakan daftar faktor/kelipatan atau faktorisasi prima untuk menemukan hasil.","story":"Dua bel berbunyi setiap 6 dan 8 menit. Jika berbunyi bersama sekarang, berapa menit lagi bersama?","storyQuestion":"KPK 6 dan 8 = 24 menit.","storyOptions":["12 menit","18 menit","24 menit"],"storyAnswer":2,"storyFeedback":"Kelipatan 6 dan 8 pertama yang sama adalah 24.","exercises":[{"q":"FPB 18 dan 24 adalah…","options":["3","6","12"],"answer":1,"explanation":"6 adalah faktor bersama terbesar."},{"q":"KPK 5 dan 7 adalah…","options":["12","25","35"],"answer":2,"explanation":"Kelipatan bersama terkecil adalah 35."}]},"Luas Bangun Datar":{"explanation":"Luas adalah ukuran bagian dalam bangun. Untuk persegi panjang: luas = panjang × lebar. Untuk persegi: luas = sisi × sisi.","why":"Luas membantu menghitung lantai yang akan dipasang ubin, permukaan meja, atau taman.","example":"Persegi panjang 8 cm × 5 cm. Luas = 8×5 = 40 cm². Jangan lupa satuan luas memakai cm² atau m².","story":"Karpet berukuran 4 m × 3 m. Berapa luas lantai yang tertutup karpet?","storyQuestion":"4 × 3 = 12 m².","storyOptions":["7 m²","12 m²","14 m²"],"storyAnswer":1,"storyFeedback":"Kalikan panjang dan lebar.","exercises":[{"q":"Persegi sisi 6 cm luasnya…","options":["12 cm²","30 cm²","36 cm²"],"answer":2,"explanation":"6×6=36 cm²."},{"q":"Segitiga alas 10 cm tinggi 4 cm luasnya…","options":["20 cm²","40 cm²","14 cm²"],"answer":0,"explanation":"Luas segitiga = 1/2×10×4=20 cm²."}]},"Volume":{"explanation":"Volume adalah banyak ruang yang dapat diisi oleh benda. Kubus dan balok memiliki volume. Volume balok = panjang × lebar × tinggi.","why":"Volume membantu menghitung kapasitas kotak, akuarium, atau ruang penyimpanan.","example":"Balok 4 cm × 3 cm × 2 cm. Volume = 4×3×2 = 24 cm³.","story":"Kotak hadiah berukuran 5 cm × 4 cm × 3 cm. Berapa ruang di dalamnya?","storyQuestion":"5 × 4 × 3 = 60 cm³.","storyOptions":["12 cm³","40 cm³","60 cm³"],"storyAnswer":2,"storyFeedback":"Kalikan panjang, lebar, dan tinggi.","exercises":[{"q":"Kubus sisi 3 cm volumenya…","options":["9 cm³","18 cm³","27 cm³"],"answer":2,"explanation":"3×3×3=27 cm³."},{"q":"Balok 2×5×4 cm volumenya…","options":["20 cm³","40 cm³","50 cm³"],"answer":1,"explanation":"2×5×4=40 cm³."}]},"Bangun Ruang":{"explanation":"Bangun ruang memiliki panjang, lebar, dan tinggi, sehingga menempati ruang. Contohnya kubus, balok, bola, tabung, kerucut, dan prisma.","why":"Kita dapat mengenali bentuk benda, membuat model, dan memahami ruang di sekitar kita.","example":"Kubus memiliki 6 sisi persegi, 12 rusuk, dan 8 titik sudut. Balok juga punya 6 sisi, tetapi sisinya berbentuk persegi panjang.","story":"Benda yang bentuknya seperti kaleng minuman adalah bangun ruang apa?","storyQuestion":"Tabung.","storyOptions":["Bola","Tabung","Kerucut"],"storyAnswer":1,"storyFeedback":"Kaleng memiliki dua lingkaran atas-bawah dan sisi melengkung, yaitu tabung.","exercises":[{"q":"Dadu berbentuk…","options":["Kubus","Tabung","Bola"],"answer":0,"explanation":"Dadu umumnya berbentuk kubus."},{"q":"Bola memiliki…","options":["Sisi datar","Permukaan lengkung","12 rusuk"],"answer":1,"explanation":"Bola memiliki permukaan lengkung."}]},"Pengolahan Data":{"explanation":"Mengolah data berarti mengumpulkan, menyusun, dan membaca informasi. Kita bisa memakai tabel, diagram batang, atau diagram gambar.","why":"Data yang rapi membantu kita membandingkan dan mengambil kesimpulan.","example":"Data jumlah buku: Senin 3, Selasa 5, Rabu 2. Total 10 buku. Hari terbanyak adalah Selasa.","story":"Kelas mengumpulkan 4 botol pada Senin, 7 pada Selasa, dan 5 pada Rabu. Hari mana paling banyak?","storyQuestion":"Selasa, karena 7 botol paling banyak.","storyOptions":["Senin","Selasa","Rabu"],"storyAnswer":1,"storyFeedback":"Bandingkan angka 4, 7, dan 5. Nilai terbesar adalah 7.","exercises":[{"q":"Total 2, 3, dan 4 adalah…","options":["7","8","9"],"answer":2,"explanation":"2+3+4=9."},{"q":"Nilai paling kecil dari 6, 1, 8 adalah…","options":["6","1","8"],"answer":1,"explanation":"1 paling kecil."}]},"Rata-rata":{"explanation":"Rata-rata adalah jumlah semua nilai dibagi banyaknya nilai. Rata-rata membantu melihat nilai yang mewakili kumpulan data.","why":"Rata-rata digunakan untuk memahami hasil belajar, skor permainan, atau jumlah secara umum.","example":"Nilai 6, 8, dan 10. Jumlahnya 24. Dibagi 3 nilai: rata-rata = 8.","story":"Skor permainan Rani adalah 70, 80, dan 90. Berapa rata-ratanya?","storyQuestion":"(70+80+90) ÷ 3 = 80.","storyOptions":["70","80","90"],"storyAnswer":1,"storyFeedback":"Jumlahkan dulu 240, lalu bagi 3 menjadi 80.","exercises":[{"q":"Data 4, 6, 8 rata-ratanya…","options":["5","6","7"],"answer":1,"explanation":"Jumlah 18 dibagi 3 = 6."},{"q":"Nilai 10 dan 14 rata-ratanya…","options":["12","13","24"],"answer":0,"explanation":"(10+14)÷2=12."}]},"Logika Matematika":{"explanation":"Logika matematika adalah cara berpikir runtut untuk mencari jawaban. Kita melihat petunjuk, pola, dan hubungan.","why":"Logika membantu menyelesaikan teka-teki, membuat keputusan, dan tidak mudah tertipu oleh tebakan.","example":"Jika semua kucing punya 4 kaki dan Mimi adalah kucing, maka Mimi punya 4 kaki. Kesimpulan mengikuti informasi.","story":"Ada tiga kotak. Kotak A lebih berat dari B. Kotak B lebih berat dari C. Kotak mana paling ringan?","storyQuestion":"Kotak C paling ringan.","storyOptions":["A","B","C"],"storyAnswer":2,"storyFeedback":"A lebih berat dari B, B lebih berat dari C, jadi C paling ringan.","exercises":[{"q":"Jika 2, 4, 8, 16 mengikuti pola, angka selanjutnya…","options":["18","24","32"],"answer":2,"explanation":"Setiap angka dikali 2, jadi 32."},{"q":"Semua burung punya sayap. Pipit adalah burung. Pipit punya…","options":["Sayap","Sirip","Roda"],"answer":0,"explanation":"Kesimpulan mengikuti pernyataan: pipit punya sayap."}]},"Tantangan HOTS":{"explanation":"HOTS adalah soal yang mengajak kita berpikir lebih dalam: mencari strategi, membandingkan cara, menjelaskan alasan, dan menyelesaikan masalah baru.","why":"Tidak semua soal cukup dengan satu rumus. Kita belajar memilih cara yang paling masuk akal dan menjelaskan mengapa.","example":"Untuk 24 siswa, beberapa tim sama besar. Pilihan tim 2, 3, 4, atau 6 siswa. Semua pilihan dapat membagi 24 tanpa sisa; tentukan jumlah tim untuk tiap pilihan.","story":"Kamu memiliki 24 kartu. Buat kelompok sama banyak tanpa sisa. Jika setiap kelompok berisi 4 kartu, berapa kelompok terbentuk?","storyQuestion":"24 ÷ 4 = 6 kelompok.","storyOptions":["4","6","8"],"storyAnswer":1,"storyFeedback":"Pikirkan pembagian: 24 kartu dibagi 4 per kelompok menghasilkan 6 kelompok.","exercises":[{"q":"Cara lain untuk membuat 24 menjadi kelompok sama banyak adalah…","options":["Kelompok 5, sisa 4","Kelompok 6, tanpa sisa","Kelompok 7, sisa 3"],"answer":1,"explanation":"6 kelompok berisi 4 adalah 24 dan tidak bersisa."},{"q":"Mengapa penting mengecek jawaban?","options":["Agar yakin hasil masuk akal","Supaya soal lebih lama","Tidak ada alasan"],"answer":0,"explanation":"Memeriksa membantu menemukan kesalahan dan memastikan jawaban masuk akal."}]}};
function chapterContent(name){
 const lesson=authoredLessons[name];
 if(lesson) return JSON.parse(JSON.stringify(lesson));
 return {explanation:`${name} adalah keterampilan matematika. Kita akan memahaminya dengan contoh sehari-hari, gambar, dan latihan.`,why:'Matematika membantu kita berpikir, mengambil keputusan, dan menyelesaikan masalah sehari-hari.',example:`Coba bayangkan contoh sederhana tentang ${name.toLowerCase()}. Baca informasi, cari apa yang ditanyakan, lalu kerjakan pelan-pelan.`,story:`Misi ${name}: gunakan matematika untuk membantu menyelesaikan masalah dalam cerita.`,storyQuestion:'Apa langkah yang paling tepat?',storyOptions:['Baca cerita, cari informasi, lalu hitung','Menebak saja','Tidak mencoba'],storyAnswer:0,storyFeedback:'Mulai dengan membaca dan memahami informasi.',exercises:[{q:'Apa langkah awal menyelesaikan soal?',options:['Pahami soal','Menebak','Tidak membaca'],answer:0,explanation:'Pahami soal terlebih dahulu.'},{q:'Matematika membantu kita…',options:['Berpikir dan memecahkan masalah','Menghafal saja','Tidak melakukan apa-apa'],answer:0,explanation:'Matematika melatih kita berpikir.'}]};
}
const seed=()=>({levels:levelSeed.map(l=>({...l,chapters:l.chapters.map((n,i)=>({id:l.id+'-'+i,name:n,content:chapterContent(n)}))})),students:[],scores:{}});
let state;try{state=JSON.parse(localStorage.getItem('bma-standalone-v1'))||seed()}catch(e){state=seed()}state.teacher=state.teacher||{};state.examResults=state.examResults||[];state.certificates=state.certificates||[];state.pptFiles=state.pptFiles||[];
// Upgrade previously auto-generated chapter content to the authored child-friendly lessons, without overwriting teacher edits.
if(state.levels){state.levels.forEach(l=>l.chapters.forEach(ch=>{const authored=authoredLessons[ch.name];if(authored&&(!ch.content||String(ch.content.explanation||'').startsWith(ch.name+' is one')||String(ch.content.explanation||'').startsWith(ch.name+' adalah salah satu keterampilan matematika.'))){ch.content=JSON.parse(JSON.stringify(authored));}}));}
let page='dashboard',levelId='foundation',chapterId='',modal=null,slide=0,slides=[],progressStudentId='',examQuestions=[],examLevelId='foundation',examStudentId='',examAnswers={},examSubmitted=false;
function save(){localStorage.setItem('bma-standalone-v1',JSON.stringify(state));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function currentLevel(){return state.levels.find(x=>x.id===levelId)||state.levels[0]}
function currentChapter(){return currentLevel()?.chapters.find(c=>c.id===chapterId)}
function navButton(p,icon,label){return `<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${icon}</span>${label}</button>`}
function render(){const lvl=currentLevel(),ch=currentChapter();let total=state.levels.reduce((s,l)=>s+l.chapters.length,0),scored=Object.values(state.scores).filter(v=>Number(v)>=80).length;
let body='';if(page==='dashboard')body=`<section class="welcome"><div><span class="tag">WELCOME, TEACHER!</span><h2>Bangun logika.<br>Tumbuhkan percaya diri. ✨</h2><p>Kelola kelas, ajarkan konsep, dan pantau perjalanan matematika setiap murid.</p><button class="btn" onclick="go('learning')">Mulai mengajar →</button></div><div class="heroart">🧮</div></section><div class="stats"><div class="stat"><span class="stat-icon">👧</span><div><small>Total Murid</small><b>${state.students.length}</b></div></div><div class="stat"><span class="stat-icon">📚</span><div><small>Total Bab</small><b>${total}</b></div></div><div class="stat"><span class="stat-icon">🏅</span><div><small>Bab tuntas (≥80)</small><b>${scored}</b></div></div><div class="stat"><span class="stat-icon">🌎</span><div><small>Level belajar</small><b>3</b></div></div></div><section class="section"><div class="sectionhead"><div><h2>Learning Worlds</h2><p>Pilih dunia belajar untuk mulai mengajar.</p></div></div>${levelCards()}</section><section class="section"><div class="sectionhead"><div><h2>Murid terbaru</h2><p>Kelola siswa lesmu.</p></div><button class="btn secondary" onclick="go('students')">Lihat semua</button></div>${studentCards(4)}</section>`;
else if(page==='learning')body=ch?lessonPage(lvl,ch):`<div class="sectionhead"><div><h2>Learning Center</h2><p>Pilih level, kemudian buka bab yang ingin diajarkan.</p></div></div>${levelCards()}<section class="learning-files"><h3>📂 PPT Materi Mengajar — ${esc(lvl.name)}</h3><p>Upload file PowerPoint (.ppt atau .pptx). Klik Buka untuk menjalankan file melalui browser atau aplikasi PowerPoint di perangkat.</p><form class="pptupload" onsubmit="uploadLearningPPT(event,'${lvl.id}')"><input name="pptFiles" type="file" accept=".ppt,.pptx,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation" multiple required><button class="btn primary">⬆ Upload PPT</button></form><div id="pptFilesList">${learningPPTList(lvl.id)}</div></section><div class="section"><div class="sectionhead"><h2>${lvl.name} — Daftar Bab</h2><button class="btn primary" onclick="addChapter()">＋ Tambah Bab</button></div><div class="cards">${lvl.chapters.map((c,i)=>`<button class="chapter" onclick="openChapter('${c.id}')"><span class="num">${String(i+1).padStart(2,'0')}</span><div><b>${esc(c.name)}</b><small>Buka materi & latihan →</small></div></button>`).join('')}</div></div>`;
else if(page==='students')body=`<div class="studentfilters"><label>1. Pilih Level<select id="studentLevelFilter" onchange="changeStudentLevelFilter(this.value)"><option value="all">Semua Level</option>${state.levels.map(l=>`<option value="${esc(l.name)}">${esc(l.name)}</option>`).join('')}<option value="Belum ditentukan">Belum ditentukan</option></select></label><label>2. Pilih Nama<select id="studentNameFilter" onchange="changeStudentNameFilter(this.value)"><option value="">Semua nama</option>${studentNameOptions()}</select></label><input class="search" id="studentSearch" placeholder="Ketik nama untuk mencari..." oninput="filterStudents(this.value)"><button class="btn primary" onclick="addStudent()">＋ Tambah Murid</button></div><div id="studentList">${studentCards(0,studentFilterLevel,studentFilterName)}</div>`;
else if(page==='progress')body=`<div class="sectionhead"><div><h2>Nilai & Progress Murid</h2><p>Pilih nama murid terlebih dahulu agar halaman tidak terlalu panjang.</p></div></div>${state.students.length?`<div class="toolbar progresspicker"><label style="font-weight:700;display:grid;gap:7px;min-width:min(360px,100%)">Pilih murid<select class="search" id="progressStudentSelect" onchange="selectProgressStudent(this.value)"><option value="">— Pilih nama murid —</option>${state.students.map(s=>`<option value="${s.id}" ${s.id===progressStudentId?'selected':''}>${esc(s.name)} • ${esc(s.grade||'')}</option>`).join('')}</select></label></div>${progressStudentId&&state.students.some(s=>s.id===progressStudentId)?progressTable(state.students.find(s=>s.id===progressStudentId)):empty('Silakan pilih murid dari daftar di atas untuk menampilkan nilai dan progress.')}`:empty('Belum ada murid. Tambahkan murid untuk mulai mencatat nilai.')}`;
else if(page==='certificates')body=certificatesPage();
else if(page==='exam')body=examPage();
else if(page==='teacher')body=teacherPage();
document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">∑</div><div><strong>BLOUNCER</strong><small>MATH ACADEMY</small></div></div><div class="navlabel">MENU UTAMA</div><div class="nav">${navButton('dashboard','🏠','Dashboard')}${navButton('learning','📚','Learning Center')}${navButton('students','👩‍🎓','Students')}${navButton('progress','📈','Progress')}${navButton('certificates','🏆','Certificates')}${navButton('exam','📝','Ujian')}${navButton('teacher','👩‍🏫','Profil Guru')}</div><div class="sidefoot">Belajar, bertumbuh, berprestasi ✨<br><small>Teacher Mode • Local Edition</small><button class="soundbtn" id="soundToggle" onclick="toggleClickSound()">🔊 Suara klik: ON</button><button class="installbtn" onclick="installApp()">⬇ Install / Download App</button></div></aside><main class="main"><header class="top"><div><span class="crumb">BLOUNCER / ${page.toUpperCase()}</span><h1>${pageTitle()}</h1></div><button class="btn primary" onclick="addStudent()">＋ Tambah Murid</button></header>${body}</main></div>${modal||''}`;if(page==='certificates')loadCertificateThumbnails()}
function pageTitle(){return ({dashboard:'Dashboard',learning:'Learning Center',students:'Student Management',progress:'Student Progress',certificates:'Certificate Center',exam:'Exam Center',teacher:'Profil Guru'})[page]||page}
function levelCards(){return `<div class="levels">${state.levels.map(l=>`<button class="level ${l.color}" onclick="chooseLevel('${l.id}')"><div class="levelhead"><span>${l.tag}</span><span class="levelemoji">${l.emoji}</span></div><h3>${esc(l.name)}</h3><p>${esc(l.desc)}</p><div class="levelfoot"><span>${l.chapters.length} bab pembelajaran</span><b>→</b></div></button>`).join('')}</div>`}
function empty(t){return `<div class="empty">📚<p>${t}</p></div>`}
function certificatesPage(){let gallery=state.certificates||[];return `<section class="certificate-upload"><h2>🏅 Galeri Sertifikat</h2><p>Upload sertifikat buatanmu agar tersimpan di galeri. Bisa berupa gambar (JPG, PNG, WEBP) atau PDF.</p><form class="certform" onsubmit="addCertificateUploads(event)"><label>Judul / nama penghargaan<input name="title" placeholder="Contoh: Juara Math Challenge" required></label><label>Untuk murid (opsional)<select name="student"><option value="">Sertifikat umum / semua anak</option>${state.students.map(st=>`<option value="${st.id}">${esc(st.name)}</option>`).join('')}</select></label><label>Level / kategori<input name="category" placeholder="Math Foundation / Juara / Apresiasi"></label><label>Pesan penyemangat<input name="message" placeholder="Terus belajar dan jangan menyerah!"></label><label class="wide">Pilih file sertifikat (bisa beberapa)<input name="files" type="file" accept="image/*,.pdf,application/pdf" multiple required></label><div class="wide"><button class="btn primary">⬆ Upload ke Galeri</button></div></form><div class="certnote">ℹ️ Galeri ini tersimpan pada browser/perangkat ini. Untuk membagikan sertifikat agar dapat dilihat dari HP atau perangkat anak-anak lain melalui website online, kita perlu menghubungkan penyimpanan cloud dan membuat halaman galeri publik pada tahap berikutnya.</div></section><div class="sectionhead"><div><h2>Sertifikat yang diunggah</h2><p>${gallery.length} file tersedia di galeri ini.</p></div></div>${gallery.length?`<div class="certgallery">${gallery.slice().reverse().map(c=>`<article class="certitem"><div class="certthumb" data-cert-id="${c.id}">${c.mime&&c.mime.startsWith('image/')?'🖼️':'📄'}</div><div class="certinfo"><h3>${esc(c.title)}</h3><p>${esc(c.category||'Certificate')}</p>${c.studentId?`<p>Untuk: ${esc((state.students.find(st=>st.id===c.studentId)||{}).name||'Murid')}</p>`:'<p>Untuk: Semua murid</p>'}${c.message?`<p>✨ ${esc(c.message)}</p>`:''}<p>${esc(c.date||'')}</p><div class="certactions"><button class="btn secondary" onclick="previewUploadedCert('${c.id}')">👁 Lihat</button><button class="btn secondary" onclick="downloadUploadedCert('${c.id}')">⬇ Download</button><button class="btn secondary" onclick="removeUploadedCert('${c.id}')">🗑 Hapus</button></div></div></article>`).join('')}</div>`:empty('Belum ada sertifikat yang diunggah. Upload sertifikat pertamamu di formulir atas.')}`}
const CERT_DB_NAME='blouncer-math-certificates',CERT_DB_STORE='files';function openCertDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('Browser tidak mendukung IndexedDB'));return}let req=indexedDB.open(CERT_DB_NAME,1);req.onupgradeneeded=()=>{let db=req.result;if(!db.objectStoreNames.contains(CERT_DB_STORE))db.createObjectStore(CERT_DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);})}
async function certFilePut(id,blob){let db=await openCertDB();return new Promise((resolve,reject)=>{let tx=db.transaction(CERT_DB_STORE,'readwrite');tx.objectStore(CERT_DB_STORE).put(blob,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function certFileGet(id){let db=await openCertDB();return new Promise((resolve,reject)=>{let tx=db.transaction(CERT_DB_STORE,'readonly'),req=tx.objectStore(CERT_DB_STORE).get(id);req.onsuccess=()=>{db.close();resolve(req.result)};req.onerror=()=>{db.close();reject(req.error)}})}
async function loadCertificateThumbnails(){document.querySelectorAll('.certthumb[data-cert-id]').forEach(async el=>{let id=el.dataset.certId,meta=(state.certificates||[]).find(c=>c.id===id);if(!meta||!meta.mime||!meta.mime.startsWith('image/'))return;try{let blob=await certFileGet(id);if(blob&&el.isConnected){let url=URL.createObjectURL(blob),img=document.createElement('img');img.alt=meta.title;img.src=url;el.replaceChildren(img);img.onload=()=>setTimeout(()=>URL.revokeObjectURL(url),60000)}}catch(e){}})}
async function certFileDelete(id){let db=await openCertDB();return new Promise((resolve,reject)=>{let tx=db.transaction(CERT_DB_STORE,'readwrite');tx.objectStore(CERT_DB_STORE).delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function addCertificateUploads(e){e.preventDefault();let form=e.target,fd=new FormData(form),files=Array.from(fd.getAll('files')||[]).filter(f=>f&&f.size);if(!files.length){alert('Pilih minimal satu file sertifikat.');return}let title=String(fd.get('title')||'Sertifikat'),studentId=String(fd.get('student')||''),category=String(fd.get('category')||''),message=String(fd.get('message')||'');for(let i=0;i<files.length;i++){let file=files[i],id='cert-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);try{await certFilePut(id,file);state.certificates.push({id,title:files.length>1?`${title} (${i+1})`:title,filename:file.name,mime:file.type||'application/octet-stream',size:file.size,category,studentId,message,date:new Date().toLocaleDateString('id-ID')});}catch(err){alert('Gagal menyimpan file '+file.name+'. Coba file yang lebih kecil atau browser lain.');}}save();}
async function previewUploadedCert(id){let c=(state.certificates||[]).find(x=>x.id===id);if(!c)return;try{let blob=await certFileGet(id);if(!blob){alert('File sertifikat tidak ditemukan di penyimpanan browser ini.');return}let url=URL.createObjectURL(blob);let w=window.open(url,'_blank');if(!w)alert('Izinkan pop-up agar file dapat dibuka.');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert('Tidak dapat membuka file sertifikat.')}}
async function downloadUploadedCert(id){let c=(state.certificates||[]).find(x=>x.id===id);if(!c)return;try{let blob=await certFileGet(id);if(!blob){alert('File tidak ditemukan di perangkat ini.');return}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=c.filename||c.title;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){alert('Tidak dapat mengunduh sertifikat.')}}
async function removeUploadedCert(id){if(!confirm('Hapus sertifikat ini dari galeri?'))return;try{await certFileDelete(id)}catch(e){}state.certificates=(state.certificates||[]).filter(x=>x.id!==id);save()}
function studentCards(limit,filterLevel='all',filterName=''){let list=state.students.filter(s=>(filterLevel==='all'||s.level===filterLevel)&&(!filterName||s.id===filterName));if(limit)list=list.slice(0,limit);return list.length?`<div class="studentgrid">${list.map(s=>`<div class="studentcard"><div class="person">${s.photo?`<img src="${s.photo}" style="height:45px;width:45px;object-fit:cover;border-radius:50%">`:s.gender==='female'?'👧':s.gender==='male'?'👦':'🧒'}</div><h3>${esc(s.name)}</h3><p>${esc(s.grade||'Kelas belum diisi')}</p><span class="badge">${esc(s.level||'Level belum dipilih')}</span><div class="student-actions"><button class="btn secondary" onclick="viewStudent('${s.id}')">Profil</button><button class="btn secondary" onclick="certStudent('${s.id}')">Sertifikat</button></div></div>`).join('')}</div>`:empty('Tidak ada murid yang sesuai filter.')}
function lessonPage(l,ch){let c=ch.content||chapterContent(ch.name);return `<div class="chaptertoolbar"><div class="toolbar"><button class="btn secondary" onclick="chapterId='';render()">← Kembali ke bab</button><button class="btn secondary" onclick="editContent('${ch.id}')">✏️ Edit materi</button><button class="btn primary" onclick="startPresentation('${ch.id}')">▶ Presentasi</button><button class="btn secondary" onclick="downloadLesson('${ch.id}')">⇩ Simpan materi</button></div></div><div class="lessonhead"><span>${l.tag}</span><h2>${esc(ch.name)}</h2><p>Belajar konsep, lihat contoh, dan coba tantangan hari ini.</p></div><div class="lessonblock"><h3>01 · Pahami konsep</h3><p>${esc(c.explanation)}</p></div><div class="lessonblock"><h3>02 · Mengapa kita belajar ini?</h3><p>${esc(c.why)}</p></div><div class="lessonblock"><h3>03 · Contoh</h3><p>${esc(c.example)}</p></div><div class="lessonblock"><h3>04 · Math Story Mission</h3><div class="visualstory"><div class="big">🧺 🧸 🍭 ⭐</div><p>${esc(c.story)}</p><b>${esc(c.storyQuestion)}</b><div class="options">${(c.storyOptions||[]).map((o,i)=>`<button onclick="storyCheck('${ch.id}',${i})">${String.fromCharCode(65+i)} · ${esc(o)}</button>`).join('')}</div><div id="storyfeedback"></div></div></div><div class="lessonblock"><h3>05 · Practice Zone</h3>${(c.exercises||[]).map((q,i)=>`<div style="padding:13px;border:1px solid #e8ebf3;border-radius:12px;margin:10px 0"><b>Soal ${i+1}</b><p>${esc(q.q)}</p><div class="options">${q.options.map((o,j)=>`<button onclick="practiceCheck('${ch.id}',${i},${j})">${String.fromCharCode(65+j)} · ${esc(o)}</button>`).join('')}</div><div id="prac-${i}"></div></div>`).join('')}</div>`}
function chooseLevel(id){levelId=id;chapterId='';page='learning';render()}
function go(p){page=p;chapterId='';render()}
function openChapter(id){chapterId=id;render()}
function storyCheck(id,index){let ch=currentChapter(),c=ch.content||chapterContent(ch.name),box=document.getElementById('storyfeedback');box.innerHTML=`<div class="feedback ${index===c.storyAnswer?'good':'bad'}">${index===c.storyAnswer?'🎉 Tepat! Kamu berhasil menyelesaikan misi!':'Belum tepat. '+esc(c.storyFeedback||'Ayo coba pikirkan lagi.')}</div>`}
function practiceCheck(id,i,j){let c=currentChapter().content||chapterContent(currentChapter().name),q=c.exercises[i],box=document.getElementById('prac-'+i);box.innerHTML=`<div class="feedback ${j===q.answer?'good':'bad'}">${j===q.answer?'✨ Benar! '+esc(q.explanation||'Mantap!'):'Coba lagi. '+esc(q.explanation||'Pikirkan kembali jawabannya.')}</div>`}

const PPT_DB='blouncer-math-ppt-files',PPT_STORE='pptFiles';
function openPPTDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open(PPT_DB,1);req.onupgradeneeded=()=>{let db=req.result;if(!db.objectStoreNames.contains(PPT_STORE))db.createObjectStore(PPT_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function putPPTFile(record){return openPPTDB().then(db=>new Promise((resolve,reject)=>{let tx=db.transaction(PPT_STORE,'readwrite');tx.objectStore(PPT_STORE).put(record);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}}))}
function getPPTFile(id){return openPPTDB().then(db=>new Promise((resolve,reject)=>{let tx=db.transaction(PPT_STORE,'readonly'),req=tx.objectStore(PPT_STORE).get(id);req.onsuccess=()=>{db.close();resolve(req.result)};req.onerror=()=>{db.close();reject(req.error)}}))}
function deletePPTFile(id){return openPPTDB().then(db=>new Promise((resolve,reject)=>{let tx=db.transaction(PPT_STORE,'readwrite');tx.objectStore(PPT_STORE).delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}}))}
function formatPPTSize(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function learningPPTList(lid){let list=(state.pptFiles||[]).filter(x=>x.levelId===lid).slice().reverse();return list.length?'<div class="pptlist">'+list.map(x=>'<article class="pptitem"><span class="ppticon">📊</span><div><div class="pptname">'+esc(x.name)+'</div><small>'+formatPPTSize(x.size)+' · PowerPoint</small></div><div class="pptactions"><button class="btn primary" onclick="openLearningPPT(\''+x.id+'\')">▶ Buka</button><button class="btn secondary" onclick="deleteLearningPPT(\''+x.id+'\')">🗑</button></div></article>').join('')+'</div>':empty('Belum ada PPT di level ini. Upload file presentasi untuk mulai mengajar.')}
async function uploadLearningPPT(e,lid){e.preventDefault();let files=Array.from(new FormData(e.target).get('pptFiles')||[]);if(!files.length)return;for(const file of files){let id='ppt-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);try{await putPPTFile({id,name:file.name,size:file.size,type:file.type,levelId:lid,blob:file,uploadedAt:new Date().toISOString()});state.pptFiles=state.pptFiles||[];state.pptFiles.push({id,name:file.name,size:file.size,type:file.type,levelId:lid,uploadedAt:new Date().toISOString()})}catch(err){alert('Gagal menyimpan '+file.name+'. Periksa kapasitas penyimpanan browser.')}}save()}
async function openLearningPPT(id){try{let file=await getPPTFile(id);if(!file||!file.blob){alert('File PPT tidak ditemukan. Silakan upload ulang.');return}let url=URL.createObjectURL(file.blob),a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000)}catch(err){alert('Tidak dapat membuka file PowerPoint pada browser ini.')}} 
async function deleteLearningPPT(id){if(!confirm('Hapus file PPT ini?'))return;try{await deletePPTFile(id);state.pptFiles=(state.pptFiles||[]).filter(x=>x.id!==id);save()}catch(err){alert('File gagal dihapus. Coba lagi.')}}
function addChapter(){let name=prompt('Nama bab baru:');if(!name?.trim())return;currentLevel().chapters.push({id:levelId+'-'+Date.now(),name:name.trim(),content:chapterContent(name.trim())});save()}
function editContent(id){let c=currentChapter().content||chapterContent(currentChapter().name);modal=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>Edit Materi Bab</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveContent(event,'${id}')"><label>Penjelasan<textarea name="explanation" rows="4">${esc(c.explanation)}</textarea></label><label>Mengapa belajar ini?<textarea name="why" rows="3">${esc(c.why)}</textarea></label><label>Contoh / cara mengerjakan<textarea name="example" rows="4">${esc(c.example)}</textarea></label><label>Soal cerita<textarea name="story" rows="4">${esc(c.story)}</textarea></label><label>Pertanyaan cerita<input name="storyQuestion" value="${esc(c.storyQuestion)}"></label><label>Opsi cerita (satu per baris)<textarea name="storyOptions" rows="3">${esc((c.storyOptions||[]).join('\n'))}</textarea></label><label>Indeks jawaban benar cerita (0 dimulai)<input name="storyAnswer" type="number" value="${c.storyAnswer||0}"></label><label>Feedback cerita<textarea name="storyFeedback">${esc(c.storyFeedback||'')}</textarea></label><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn primary">Simpan Materi</button></div></form></div></div>`;render()}
function saveContent(e,id){e.preventDefault();let f=new FormData(e.target),ch=currentChapter();ch.content={...ch.content,...Object.fromEntries(['explanation','why','example','story','storyQuestion','storyFeedback'].map(k=>[k,f.get(k)])),storyOptions:f.get('storyOptions').split('\n').filter(Boolean),storyAnswer:Number(f.get('storyAnswer'))};modal=null;save()}
function closeModal(){modal=null;render()}
function addStudent(){modal=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>Tambah Murid</h2><button onclick="closeModal()">✕</button></div><form class="form" onsubmit="saveStudent(event)"><label>Nama murid<input name="name" required></label><label>Jenis kelamin<select name="gender"><option value="">Tidak dipilih</option><option value="male">Laki-laki</option><option value="female">Perempuan</option></select></label><label>Foto profil (opsional)<input name="photo" type="file" accept="image/*"></label><label>Kelas sekolah<select name="grade"><option value="">Pilih kelas</option>${[1,2,3,4,5,6].map(n=>`<option>Kelas ${n} SD</option>`).join('')}</select></label><label>Level belajar<select name="level"><option>Math Foundation</option><option>Math Development</option><option>Math Advanced</option><option>Belum ditentukan</option></select></label><label>Nama orang tua<input name="parent"></label><label>Kontak orang tua<input name="phone"></label><label>Catatan<textarea name="notes" rows="2"></textarea></label><div class="formactions"><button type="button" class="btn secondary" onclick="closeModal()">Batal</button><button class="btn primary">Simpan Murid</button></div></form></div></div>`;render()}
function compressPhoto(file,done){if(!file||!file.size){done('');return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,600/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);done(canvas.toDataURL('image/jpeg',.76))};img.onerror=()=>done(reader.result);img.src=reader.result};reader.readAsDataURL(file)}
function saveStudent(e){e.preventDefault();let f=new FormData(e.target),file=f.get('photo'),st={id:'student-'+Date.now(),name:f.get('name'),gender:f.get('gender'),grade:f.get('grade'),level:f.get('level'),parent:f.get('parent'),phone:f.get('phone'),notes:f.get('notes'),joined:new Date().toLocaleDateString('id-ID')};compressPhoto(file,data=>{if(data)st.photo=data;state.students.push(st);modal=null;save()})}
let studentFilterLevel='all',studentFilterName='',studentSearchText='';function studentNameOptions(){return state.students.filter(s=>studentFilterLevel==='all'||s.level===studentFilterLevel).slice().sort((a,b)=>a.name.localeCompare(b.name,'id')).map(s=>`<option value="${s.id}" ${s.id===studentFilterName?'selected':''}>${esc(s.name)} · ${esc(s.level||'Level belum dipilih')}</option>`).join('')}function applyStudentFilters(){let target=document.getElementById('studentList');if(!target)return;target.innerHTML=studentCards(0,studentFilterLevel,studentFilterName);if(studentSearchText){let needle=studentSearchText.toLowerCase();target.querySelectorAll('.studentcard').forEach(card=>card.style.display=card.querySelector('h3').textContent.toLowerCase().includes(needle)?'':'none')}}function changeStudentLevelFilter(level){studentFilterLevel=level;studentFilterName='';let n=document.getElementById('studentNameFilter');if(n)n.innerHTML='<option value="">Semua nama</option>'+studentNameOptions();applyStudentFilters()}function changeStudentNameFilter(id){studentFilterName=id;applyStudentFilters()}function filterStudents(q){studentSearchText=q||'';applyStudentFilters()}
function setScore(key,val){if(val===''){delete state.scores[key]}else state.scores[key]=Math.max(0,Math.min(100,Number(val)));save()}
function selectProgressStudent(id){progressStudentId=id;render()}
function progressTable(student){let lvl=state.levels.find(l=>l.name===student.level)||state.levels[0];let rows=lvl.chapters.map(ch=>{let key=student.id+':'+ch.id,val=state.scores[key];return `<tr><td><b>${esc(student.name)}</b><br><span class="smallmuted">${esc(student.grade||'')}</span></td><td>${esc(lvl.name)}</td><td>${esc(ch.name)}</td><td><input type="number" min="0" max="100" value="${val??''}" placeholder="—" onchange="setScore('${key}',this.value)"></td><td class="${val>=80?'scorepass':'scorefail'}">${val==null?'Belum dinilai':val>=80?'Tuntas':'Perlu latihan'}</td></tr>`}).join('');return `<div class="sectionhead"><div><h3>${esc(student.name)} — ${esc(lvl.name)}</h3><p>${lvl.chapters.length} bab yang perlu dinilai. Nilai 80 ke atas = tuntas.</p></div><button class="btn secondary" onclick="progressStudentId='';render()">Ganti murid</button></div><div class="tablewrap"><table><thead><tr><th>MURID</th><th>LEVEL</th><th>BAB</th><th>NILAI (0–100)</th><th>STATUS</th></tr></thead><tbody>${rows}</tbody></table></div>`}

function viewStudent(id){let s=state.students.find(x=>x.id===id);if(!s)return;let scored=Object.entries(state.scores).filter(([k])=>k.startsWith(id+':'));let total=scored.length,avg=total?Math.round(scored.reduce((sum,[,v])=>sum+Number(v),0)/total):'—';modal=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>Profil Murid</h2><button onclick="closeModal()">✕</button></div><div class="profile"><div class="emoji">${s.photo?`<img src="${s.photo}" class="profilepic">`:s.gender==='female'?'👧':s.gender==='male'?'👦':'🧒'}</div><div><h2>${esc(s.name)}</h2><p>${esc(s.grade||'')} • ${esc(s.level||'')}</p></div></div><div class="lessonblock"><p>Orang tua: <b>${esc(s.parent||'—')}</b><br>Kontak: <b>${esc(s.phone||'—')}</b><br>Tanggal daftar: <b>${esc(s.joined||'')}</b><br>Bab dinilai: <b>${total}</b><br>Rata-rata nilai: <b>${avg}</b><br>Catatan: ${esc(s.notes||'—')}</p></div><button class="btn primary" onclick="certStudent('${id}')">Cetak Sertifikat</button><button class="btn secondary" onclick="closeModal()">Tutup</button></div></div>`;render()}
function certStudent(id){let s=state.students.find(x=>x.id===id);if(!s)return;modal=null;let html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Certificate</title><style>body{font-family:Arial;background:#f3f5fa;padding:30px}.cert{max-width:1000px;margin:20px auto;background:white;padding:60px;border:12px double #d2ae48;text-align:center;color:#1c2d55}.brand{letter-spacing:3px}.cert h1{font-size:38px;color:#b08a20}.name{font-size:40px;font-weight:bold;margin:30px}.cert p{line-height:1.7;font-size:18px}@media print{body{background:white;padding:0}.cert{margin:0;max-width:none;height:95vh}}</style></head><body onload="window.print()"><div class="cert"><div class="brand">BLOUNCER MATH ACADEMY</div><h1>CERTIFICATE OF ACHIEVEMENT</h1><p>Dengan bangga diberikan kepada</p><div class="name">${esc(s.name)}</div><p>Atas penyelesaian dan pencapaian pada level matematika</p><h2>${esc(s.level||'Math Academy')}</h2><p>Terus belajar, berani mencoba, dan berpikir cerdas.</p><p>${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</p><p style="margin-top:65px">________________________<br>Pengajar</p></div></body></html>`;let w=window.open('','certificate');if(w){w.document.write(html);w.document.close()}}
function startPresentation(id){let ch=currentChapter(),c=ch.content||chapterContent(ch.name);slides=[{title:ch.name,body:'Mari belajar bersama!\n'+currentLevel().name},{title:'Pahami Konsep',body:c.explanation},{title:'Mengapa penting?',body:c.why},{title:'Contoh',body:c.example},{title:'Math Story Mission',body:c.story+'\n\n'+c.storyQuestion}];slide=0;modal=`<div class="presentation"><button class="presclose" onclick="closePresentation()">✕ Keluar</button><div class="prescontent"><div class="presbrand">BLOUNCER MATH ACADEMY • ${currentLevel().name}</div><h1 id="slideTitle">${esc(slides[0].title)}</h1><div class="presbody" id="slideBody">${esc(slides[0].body)}</div></div><div class="prescontrols"><button onclick="presStep(-1)" id="presPrev" disabled>← Sebelumnya</button><span id="slideCount">1 / ${slides.length}</span><button onclick="presStep(1)" id="presNext">Selanjutnya →</button></div></div>`;render()}
function presStep(d){slide=Math.max(0,Math.min(slides.length-1,slide+d));document.getElementById('slideTitle').textContent=slides[slide].title;document.getElementById('slideBody').textContent=slides[slide].body;document.getElementById('slideCount').textContent=`${slide+1} / ${slides.length}`;document.getElementById('presPrev').disabled=slide===0;document.getElementById('presNext').disabled=slide===slides.length-1}
function closePresentation(){modal=null;render()}
function downloadLesson(id){let c=currentChapter(),content=c.content||chapterContent(c.name),text=`BLOUNCER MATH ACADEMY\n${currentLevel().name}\n${c.name}\n\nKONSEP\n${content.explanation}\n\nMENGAPA\n${content.why}\n\nCONTOH\n${content.example}\n\nSOAL CERITA\n${content.story}\n${content.storyQuestion}\n\nLATIHAN\n${content.exercises.map((q,i)=>`${i+1}. ${q.q}\n${q.options.map((o,j)=>`${String.fromCharCode(65+j)}. ${o}`).join('\n')}\nJawaban: ${String.fromCharCode(65+q.answer)}\nPembahasan: ${q.explanation}`).join('\n\n')}`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=`Materi-${c.name.replace(/\s/g,'-')}.txt`;a.click();URL.revokeObjectURL(a.href)}

function examVisual(topic){let t=topic.toLowerCase();if(t.includes('pecahan'))return '🍕';if(t.includes('perkalian'))return '🍪🍪';if(t.includes('pembagian'))return '🧺';if(t.includes('uang')||t.includes('persen'))return '🛒💰';if(t.includes('luas')||t.includes('keliling'))return '🏡📐';if(t.includes('waktu')||t.includes('kecepatan'))return '⏰🚲';if(t.includes('volume')||t.includes('debit'))return '🧃💧';if(t.includes('data')||t.includes('rata'))return '📊';return '🧩🌟'}
function examPage(){let opts=state.students.map(st=>`<option value="${st.id}" ${st.id===examStudentId?'selected':''}>${esc(st.name)}</option>`).join('');return `<div class="examcard"><h2>📝 Ujian Matematika — 10 Soal</h2><p>Sepuluh soal cerita pilihan ganda, diambil dari materi level yang dipilih. Soal menampilkan visual emoji sesuai konteks.</p><div class="toolbar"><label>Level <select class="examselect" onchange="setExamLevel(this.value)">${state.levels.map(l=>`<option value="${l.id}" ${l.id===examLevelId?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label><label>Murid (opsional) <select class="examselect" onchange="examStudentId=this.value"><option value="">— Pilih murid —</option>${opts}</select></label><button class="btn primary" onclick="startExam()">${examQuestions.length?'Buat ulang ujian':'Mulai ujian'}</button></div>${examQuestions.length?examRender():`<div class="empty">Pilih level, lalu tekan Mulai Ujian untuk membuat 10 soal.</div>`}</div>`}
function setExamLevel(id){examLevelId=id;examQuestions=[];examAnswers={};examSubmitted=false;render()}
function startExam(){let lvl=state.levels.find(l=>l.id===examLevelId)||state.levels[0],pool=[];lvl.chapters.forEach(ch=>{let c=ch.content||chapterContent(ch.name);(c.exercises||[]).forEach(q=>pool.push({chapter:ch.name,question:q.q,options:q.options,answer:q.answer,explanation:q.explanation||'',visual:examVisual(ch.name)}));if(c.storyQuestion&&c.storyOptions&&c.storyOptions.length>1)pool.push({chapter:ch.name,question:(c.story||'')+' '+c.storyQuestion,options:c.storyOptions,answer:c.storyAnswer,explanation:c.storyFeedback||'',visual:examVisual(ch.name)});});if(pool.length<10){alert('Soal dari level ini belum cukup untuk membuat ujian 10 soal.');return}pool.sort(()=>Math.random()-.5);examQuestions=pool.slice(0,10);examAnswers={};examSubmitted=false;render()}
function examRender(){let correct=examQuestions.filter((q,i)=>examAnswers[i]===q.answer).length;return `<div>${examQuestions.map((q,i)=>`<div class="examq"><div class="examvisual">${q.visual}</div><small>Soal ${i+1} · ${esc(q.chapter)}</small><p><b>${esc(q.question)}</b></p><div class="options">${q.options.map((o,j)=>`<button class="${examAnswers[i]===j?'chosen':''}" onclick="answerExam(${i},${j})" ${examSubmitted?'disabled':''}>${String.fromCharCode(65+j)} · ${esc(o)}</button>`).join('')}</div>${examSubmitted?`<div class="feedback ${examAnswers[i]===q.answer?'good':'bad'}">${examAnswers[i]===q.answer?'Benar!':'Jawaban benar: '+String.fromCharCode(65+q.answer)+'.'} ${esc(q.explanation)}</div>`:''}</div>`).join('')}</div>${examSubmitted?`<div class="examresult"><h2>Nilai: ${correct*10}/100</h2><p>${correct>=8?'🎉 Lulus ujian! (minimal 80)':'Belum lulus. Pelajari kembali bab yang belum dikuasai, lalu coba lagi.'}</p><button class="btn primary" onclick="startExam()">Ujian baru</button></div>`:`<button class="btn primary" onclick="submitExam()">Kumpulkan Jawaban</button>`}`}
function answerExam(i,j){if(examSubmitted)return;examAnswers[i]=j;render()}
function submitExam(){if(Object.keys(examAnswers).length!==10&&!confirm('Masih ada soal yang belum dijawab. Tetap kumpulkan?'))return;examSubmitted=true;let score=examQuestions.filter((q,i)=>examAnswers[i]===q.answer).length*10;if(examStudentId){state.examResults=state.examResults||[];state.examResults.push({studentId:examStudentId,level:examLevelId,score,date:new Date().toISOString()});localStorage.setItem('bma-standalone-v1',JSON.stringify(state))}render()}
function teacherPage(){let t=state.teacher||{};return `<div class="examcard"><div class="teacherhero"><div class="teacheravatar">${t.photo?`<img src="${t.photo}" class="teacheravatar">`:'👩‍🏫'}</div><div><h2>${esc(t.name||'Profil Guru')}</h2><p>${esc(t.title||'Pengajar BLOUNCER MATH ACADEMY')}</p></div></div><h2>Profil Pengajar</h2><form class="form" onsubmit="saveTeacher(event)"><label>Nama guru<input name="name" value="${esc(t.name||'')}" placeholder="Nama pengajar"></label><label>Jabatan / gelar<input name="title" value="${esc(t.title||'')}" placeholder="Guru Matematika"></label><label>Foto profil<input name="photo" type="file" accept="image/*"></label><label>Perkenalan<textarea name="bio" rows="4">${esc(t.bio||'')}</textarea></label><label>Motivasi mengajar<textarea name="motto" rows="2">${esc(t.motto||'')}</textarea></label><button class="btn primary">Simpan Profil</button></form><div class="lessonblock"><h3>Perkenalan</h3><p>${esc(t.bio||'Belum ada perkenalan.')}</p><b>${esc(t.motto||'')}</b></div></div>`}
function saveTeacher(e){e.preventDefault();let f=new FormData(e.target),t={name:f.get('name'),title:f.get('title'),bio:f.get('bio'),motto:f.get('motto')},file=f.get('photo');compressPhoto(file,data=>{t.photo=data||(state.teacher&&state.teacher.photo)||'';state.teacher=t;save()})}

window.go=go;window.chooseLevel=chooseLevel;window.openChapter=openChapter;window.addChapter=addChapter;window.editContent=editContent;window.saveContent=saveContent;window.closeModal=closeModal;window.addStudent=addStudent;window.saveStudent=saveStudent;window.filterStudents=filterStudents;window.changeStudentLevelFilter=changeStudentLevelFilter;window.changeStudentNameFilter=changeStudentNameFilter;window.uploadLearningPPT=uploadLearningPPT;window.openLearningPPT=openLearningPPT;window.deleteLearningPPT=deleteLearningPPT;window.setScore=setScore;window.selectProgressStudent=selectProgressStudent;window.viewStudent=viewStudent;window.certStudent=certStudent;window.startPresentation=startPresentation;window.presStep=presStep;window.closePresentation=closePresentation;window.downloadLesson=downloadLesson;window.storyCheck=storyCheck;window.practiceCheck=practiceCheck;window.setExamLevel=setExamLevel;window.startExam=startExam;window.answerExam=answerExam;window.submitExam=submitExam;window.saveTeacher=saveTeacher;window.addCertificateUploads=addCertificateUploads;window.previewUploadedCert=previewUploadedCert;window.downloadUploadedCert=downloadUploadedCert;window.removeUploadedCert=removeUploadedCert;

// Click sounds synthesized locally. The toggle preference is remembered in this browser.
let clickSoundEnabled=localStorage.getItem('bma-click-sound')!=='off';let audioCtx;
function playClickSound(){if(!clickSoundEnabled)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(720,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(520,audioCtx.currentTime+.045);gain.gain.setValueAtTime(.045,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.065);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+.07)}catch(e){}}
document.addEventListener('click',e=>{if(e.target.closest('button, .level, .chapter, a'))playClickSound()},{capture:true});
function toggleClickSound(){clickSoundEnabled=!clickSoundEnabled;localStorage.setItem('bma-click-sound',clickSoundEnabled?'on':'off');const b=document.getElementById('soundToggle');if(b)b.textContent=clickSoundEnabled?'🔊 Suara klik: ON':'🔇 Suara klik: OFF';if(clickSoundEnabled)playClickSound()}
let installPromptEvent=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPromptEvent=e});
async function installApp(){if(installPromptEvent){installPromptEvent.prompt();await installPromptEvent.userChoice;installPromptEvent=null;return}alert('Untuk memasang BLOUNCER MATH ACADEMY:\n\n1. Deploy website ke hosting HTTPS (GitHub Pages, Cloudflare Pages, atau Vercel).\n2. Buka link website di Chrome.\n3. Menu ⋮ → Install app / Tambahkan ke layar utama.\n\nZIP ini juga bisa dibuka offline di laptop. Install PWA di HP membutuhkan website HTTPS.');}
window.toggleClickSound=toggleClickSound;window.installApp=installApp;
if(location.protocol==='http:'||location.protocol==='https'){if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}

render();
</script></body></html>
